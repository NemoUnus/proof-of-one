# SPDX-License-Identifier: Apache-2.0
# The identity registry's batch job (Decision #61; reference/testnet/batch-job.js). TEST NETWORK.
# Every hour: reads new registrations, inserts each full batch of 4 through the relay, and
# completes a batch left incomplete for 48 hours with filler members. The published tree
# (reference/testnet/web/identity-tree.json) is committed when it changes.
# Secret: FILLER_KEY, the TEST-ONLY filler key (only needed for fillers and for "key-leaf").
# Run by hand with mode "key-leaf" to print the filler key's public leaf for the key set.
name: Registry batches

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run, or key-leaf"
        default: "run"
        required: true

permissions:
  contents: write

concurrency:
  group: registry-batches
  cancel-in-progress: false

jobs:
  batches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies and circuits (π_reg, π_batch)
        run: |
          (cd reference/relay && npm ci --no-audit --no-fund)
          (cd reference/tally && npm ci --no-audit --no-fund)
          cd reference/enrolment-circuit && npm ci --no-audit --no-fund
          mkdir -p build
          npx circom2 circuits/registration.circom --wasm --O2 -o build
          npx circom2 circuits/batch_insert.circom --wasm --O2 -o build
      - name: Batch job
        env:
          FILLER_KEY: ${{ secrets.FILLER_KEY }}
          RPC_URL: https://sepolia.base.org
          RELAY_URL: https://proof-of-one-relay.nemounus.workers.dev
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          case "$MODE" in run|key-leaf) ;; *) echo "mode must be run or key-leaf"; exit 1;; esac
          if [ "$MODE" = "run" ] && [ ! -f reference/testnet/web/keyset.json ]; then echo "no key set published yet"; exit 0; fi
          node reference/testnet/batch-job.js "$MODE"
      - name: Publish the tree
        if: ${{ (github.event.inputs.mode || 'run') == 'run' }}
        run: |
          [ -f reference/testnet/web/identity-tree.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/testnet/web/identity-tree.json
          if git diff --cached --quiet; then echo "tree unchanged"; exit 0; fi
          git commit -m "Identity tree: registry state $(date -u +%Y-%m-%dT%H:%MZ) (batch job)"
          git pull --rebase
          git push
