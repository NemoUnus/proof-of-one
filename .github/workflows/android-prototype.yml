# SPDX-License-Identifier: Apache-2.0
# Builds the test chip-reader app (reference/android-prototype) on GitHub's servers and
# attaches the APK to the run, so anyone can check that the published APK comes from this
# source. Test build only: debug-signed, not for distribution.
name: Android chip reader (test build)

on:
  push:
    paths:
      - "reference/android-prototype/**"
      - ".github/workflows/android-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build the debug APK
        working-directory: reference/android-prototype
        run: gradle --no-daemon assembleDebug
      - name: Checksum
        run: sha256sum reference/android-prototype/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: proof-of-one-reader-debug-apk
          path: |
            reference/android-prototype/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          retention-days: 30
