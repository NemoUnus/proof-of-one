# SPDX-License-Identifier: Apache-2.0
# Builds the test app (reference/android-prototype) on GitHub's servers and attaches the APK
# to the run, so anyone can check that the published APK comes from this source. Test build
# only: debug-signed, not for distribution.
# Since v0.2 the app includes the native prover (reference/native-prover, Rust), built here
# for 64-bit ARM, and the ballot proof's TEST-ONLY key and witness graph as assets.
# Since v0.5 it also makes the enrolment proof π_doc (suite 2) from a real passport's chip
# data: the circuit's witness graph, a random TEST-ONLY key and the one-signer test tree are
# made here from the repository's sources.
name: Android chip reader (test build)

on:
  push:
    paths:
      - "reference/android-prototype/**"
      - "reference/native-prover/**"
      - "reference/prove-bench/**"
      - "reference/document-circuit/**"
      - ".github/workflows/android-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Tools for the native prover
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          rustup target add aarch64-linux-android
      - name: Build the native prover for arm64-v8a
        working-directory: reference/native-prover
        # The NDK's compiler is named with the Android API level (26 = Android 8). The same
        # versioned target is given to bindgen (in circom-witnesscalc's build script): recent
        # NDK headers refuse an unversioned one. ANDROID_NDK_LATEST_HOME is set by GitHub's
        # Ubuntu image.
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"; echo "NDK: $NDK"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export CC_aarch64_linux_android="$TC/bin/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TC/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export CLANG_PATH="$CC_aarch64_linux_android"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android26 --sysroot=$TC/sysroot"
          # circom-witnesscalc's build script looks for the compiler under the target name with
          # dashes, which a shell cannot export; `env` passes it.
          env "CC_aarch64-linux-android=$CC_aarch64_linux_android" \
            cargo build --release --locked --lib --target aarch64-linux-android
          mkdir -p ../android-prototype/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libpoo_native_prover.so ../android-prototype/app/src/main/jniLibs/arm64-v8a/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Enrolment proof π_doc, suite 2 (challenge 2 of Decision Log #57): everything is made here
      # from the repository's sources: the circuit, its witness graph (circom-witnesscalc's
      # build-circuit, v0.3.0, dependencies pinned by its Cargo.lock), the one-signer test tree's
      # graph, a synthetic passport's input and witness, and a random TEST-ONLY key (prove-mem).
      - name: Enrolment proof files (π_doc suite 2, TEST-ONLY random key)
        run: |
          mkdir -p $HOME/bin && curl -sSL -o $HOME/bin/circom https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64 && chmod +x $HOME/bin/circom
          export PATH=$HOME/bin:$PATH
          git clone -q --depth 1 --branch v0.3.0 https://github.com/iden3/circom-witnesscalc $RUNNER_TEMP/cw
          (cd $RUNNER_TEMP/cw && cargo build --release --locked -p build-circuit --bin build-circuit && cargo build --release --locked --bin calc-witness)
          CW=$RUNNER_TEMP/cw/target/release
          (cd reference/ballot-circuit && npm ci --no-audit --no-fund)
          cd reference/document-circuit && npm ci --no-audit --no-fund
          mkdir -p build && circom circuits/document_s2.circom --r1cs --wasm --O2 -l node_modules -o build
          $CW/build-circuit circuits/document_s2.circom build/document_s2.graph -l node_modules -l node_modules/circomlib/circuits -l circuits
          $CW/build-circuit circuits/test/dsc_test_tree_s2.circom build/dsc_test_tree_s2.graph -l node_modules -l node_modules/circomlib/circuits -l circuits
          node scripts/make-witness.js 2
          # The witness graph must give exactly the witness of circom's own generator.
          $CW/calc-witness build/document_s2.graph build/bench_s2.input.json build/graph_s2.wtns
          cmp build/graph_s2.wtns build/bench_s2.wtns && echo "witness graph matches the WebAssembly witness"
          cd ../prove-bench && cargo build --release --locked --bin prove-mem
          D=$RUNNER_TEMP/doc && mkdir -p $D
          ./target/release/prove-mem setup ../document-circuit/build/document_s2.r1cs ../document-circuit/build/bench_s2.wtns $D
          ./target/release/prove-mem compress - - $D
          gzip -6 -c $D/matrices.bin > $D/doc_matrices.gz
          ls -la $D ../document-circuit/build
      # The phone's input builder (DocInput.kt) must build exactly the reference input
      # (document-circuit/src/document.js) on synthetic passports of both suites.
      - name: Check the phone's enrolment input builder
        run: |
          curl -sSL -o $RUNNER_TEMP/kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q $RUNNER_TEMP/kc.zip -d $RUNNER_TEMP
          (cd reference/document-circuit && node scripts/doc-input-vectors.js $RUNNER_TEMP/vectors)
          cd reference/android-prototype
          $RUNNER_TEMP/kotlinc/bin/kotlinc test/DocInputCheck.kt app/src/main/java/io/github/nemounus/proofofone/reader/DocInput.kt -include-runtime -d $RUNNER_TEMP/check.jar
          java -cp $RUNNER_TEMP/check.jar DocInputCheckKt $RUNNER_TEMP/vectors
      - name: Proof files as app assets
        run: |
          A=reference/android-prototype/app/src/main/assets
          mkdir -p $A
          cp reference/native-prover/graphs/ballot.graph $A/
          cp reference/ballot-circuit/setup/ballot_test.zkey $A/
          cp reference/phone-bench/input.json $A/
          cp $RUNNER_TEMP/doc/pk_c.bin $A/doc_s2_pk_c.bin
          # not .gz: Android's packager strips a .gz suffix from asset names
          cp $RUNNER_TEMP/doc/doc_matrices.gz $A/doc_s2_matrices.gzdata
          cp reference/document-circuit/build/document_s2.graph reference/document-circuit/build/dsc_test_tree_s2.graph $A/
          cp reference/document-circuit/build/bench_s2.input.json $A/doc_s2_input.json
          sha256sum $A/* reference/android-prototype/app/src/main/jniLibs/arm64-v8a/*.so
      # Face check test (v0.4, Decision Log #57): InsightFace "buffalo_sc" models, SCRFD-500M
      # detector and ArcFace MobileFaceNet (pretrained models for non-commercial research use
      # only), downloaded from InsightFace's release and checked against their SHA-256.
      - name: Face models
        run: |
          A=reference/android-prototype/app/src/main/assets
          curl -sSL -o $RUNNER_TEMP/buffalo_sc.zip https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_sc.zip
          unzip -o -q $RUNNER_TEMP/buffalo_sc.zip -d $RUNNER_TEMP/face
          cp $RUNNER_TEMP/face/det_500m.onnx $RUNNER_TEMP/face/w600k_mbf.onnx $A/
          (cd $A && sha256sum -c ../../../../face/models.sha256)
      - name: Build the debug APK
        working-directory: reference/android-prototype
        run: gradle --no-daemon assembleDebug
      - name: Checksum
        run: sha256sum reference/android-prototype/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: proof-of-one-reader-debug-apk
          path: |
            reference/android-prototype/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          retention-days: 30
