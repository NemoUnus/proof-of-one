# Proof of One — the pilot's enrolment service (TEST). Design:
# docs/specs/pilot-enrolment-service-v0.1.md. Secrets (OPRF_KEY, CREDENTIAL_KEY,
# REVOCATION_KEY), the issuing-state rules (RULES) and the CSCA certificates (CSCA_CERTS) are
# set in the Cloudflare dashboard (Settings → Variables and secrets), never in this file.
name = "proof-of-one-enrol"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false
keep_vars = true      # keep the variables set in the dashboard when deploying from the repository

[vars]
RPC_URL = "https://sepolia.base.org"
# Asked only when RPC_URL does not answer three times; at least two must answer and agree.
RPC_FALLBACKS = "https://base-sepolia-rpc.publicnode.com,https://base-sepolia.drpc.org,https://base-sepolia.gateway.tenderly.co"
DOC_VERIFIER = "0x78657778ee5C48Fd4FB792884b9C660D48D31de8"   # deployment 4 (21 Nov 2026), testnet/web/plan5.json
EPOCH = "0"
DAILY_SESSIONS = "300"
