# Proof of One test ballot relay. Set RELAY_KEY as a secret in the Cloudflare dashboard
# (Settings → Variables and secrets), never in this file.
name = "proof-of-one-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false   # one public address only: the relay that config.json names

[vars]
RPC_URL = "https://sepolia.base.org"
CHAIN_ID = "84532"
POLLS = "0xe452f371DF42b58a022a6C0F3F7f46507b7fe4bB"   # deployment 2 (poll 2 on the first deployment closed on 12 Nov)
POLL_IDS = "1"   # test poll 3

[observability]
enabled = false   # no request logs: the relay keeps no record of who sent what
